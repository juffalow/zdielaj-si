name: Application

on:
  push:
    branches:
      - master
  release:
    types:
      - published

defaults:
  run:
    working-directory: ./application

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: Check application
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Enable corepack
      run: corepack enable
    - uses: actions/setup-node@v6
      with:
        node-version: 26
        cache: 'yarn'
        cache-dependency-path: './application/yarn.lock'
    - name: Install dependencies
      run: yarn install
    - name: Lint
      run: yarn run lint
    - name: Prettier check
      run: yarn run prettier:check
  deploy_application_stage:
    name: Deploy application to stage
    needs: [ check ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.0.0
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ secrets.AWS_REGION }}
        audience: sts.amazonaws.com
    - name: Enable corepack
      run: corepack enable
    - uses: actions/setup-node@v6
      with:
        node-version: 26
        cache: 'yarn'
        cache-dependency-path: './application/yarn.lock'
    - name: Install dependencies
      run: yarn install
    - name: Build
      run: yarn run build --mode staging
    - name: Sync build folder with S3
      run: aws s3 sync ./build/client s3://juffalow-my-projects/zdielaj-si-stage
    - name: Invalidate CloudFront cache
      run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_STAGE_DISTRIBUTION_ID }} --paths "/*"
  deploy_application_prod:
    name: Deploy application to production
    needs: [ check ]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.0.0
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ secrets.AWS_REGION }}
        audience: sts.amazonaws.com
    - name: Set tag variable
      id: version
      run: echo ::set-output name=version::${GITHUB_REF#"refs/tags/"}
    - name: Enable corepack
      run: corepack enable
    - uses: actions/setup-node@v6
      with:
        node-version: 26
        cache: 'yarn'
        cache-dependency-path: './application/yarn.lock'
    - name: Install dependencies
      run: yarn install
    - name: Build
      env:
        VITE_APP_VERSION: ${{ steps.version.outputs.version }}
      run: yarn run build
    - name: Sync build folder with S3
      run: aws s3 sync ./build/client s3://juffalow-my-projects/zdielaj-si
    - name: Invalidate CloudFront cache
      run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_PROD_DISTRIBUTION_ID }} --paths "/*"
    - name: Slack notification
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
        RELEASE_DESCRIPTION: ${{ github.event.release.body }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        PAYLOAD=$(jq -n --arg version "$RELEASE_VERSION" --arg description "$RELEASE_DESCRIPTION" '{text: "[Release]: \($version)\n\($description)"}')
        curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" $SLACK_WEBHOOK_URL
